[project]
name = "ken-engine"
version = "0.1.0"
description = "Ken — a local context engine behind an MCP server: your tasks, people, projects and what happened, kept current for any agent."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",   # async SQLite — the queue bus and the store
  "openai>=1.40",      # V1 LLM provider (interface is provider-agnostic)
  "httpx>=0.27",       # connectors and world-data tools
  "pyyaml>=6.0",       # ~/.ken config
]

[project.scripts]
ken = "ken.__main__:main"
ken-mcp = "ken.mcp_server:main"   # needs the `mcp` extra

[project.optional-dependencies]
mcp = [
  "mcp>=2",            # optional: `python -m ken.mcp_server` — tell/ask Ken from another agent session
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff==0.16.2",       # pinned: a new ruff changes its default rules and breaks CI
  "mcp>=2",            # the MCP tests exercise the real server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# agents declare `triggers = [...]` as a class attribute: that is the plugin contract
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ005", "DTZ006"]   # tests build local wall-clock times on purpose
